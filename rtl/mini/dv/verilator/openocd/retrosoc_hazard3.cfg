# Hazard3 RISC-V Debug Module through the local Verilator remote-bitbang TAP.
# The caller must define jtag_port before loading this file.
adapter driver remote_bitbang
remote_bitbang port $jtag_port
adapter speed 10000
transport select jtag

set _CHIPNAME retrosoc
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu
