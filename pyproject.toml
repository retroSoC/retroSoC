[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".cache",
  "build",
  "dist",
  "app/coremark/coremark-main",
  "app/fatfs/ff16",
  "pdk/IHP-Open-PDK",
  "pdk/icsprout55-pdk",
  "rtl/managed/clusterip",
  "rtl/managed/third_party",
  "rtl/managed/mpw",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
