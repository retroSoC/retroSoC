name: Set up locked toolchains
description: Install checksum-verified retroSoC tool archives and their runtime libraries

inputs:
  tools:
    description: Space-separated tool names from dependencies/dependencies.lock.json
    required: true

runs:
  using: composite
  steps:
    - name: Install runtime packages
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          ccache g++ libfl2 libgoogle-perftools4 libunwind8 make mold numactl zlib1g

    - name: Install checksum-verified tools
      shell: bash
      env:
        REQUESTED_TOOLS: ${{ inputs.tools }}
      run: |
        read -r -a tools <<< "${REQUESTED_TOOLS}"
        args=()
        for tool in "${tools[@]}"; do
          args+=(--tool "${tool}")
        done
        python3 scripts/install_toolchain.py \
          --lock dependencies/dependencies.lock.json \
          --platform ubuntu-22.04 \
          --cache .cache/retrosoc \
          --github-path "${GITHUB_PATH}" \
          "${args[@]}"
