name: full-flow

on:
  workflow_dispatch:
    inputs:
      pdk:
        description: PDK matrix to execute
        required: true
        default: IHP130
        type: choice
        options: [IHP130, GF180, ICS55, SKY130]
      runner:
        description: ubuntu-22.04 or a provisioned high-memory runner label
        required: true
        default: ubuntu-22.04
        type: string
      timeout_minutes:
        description: Maximum job duration
        required: true
        default: 720
        type: number

permissions:
  contents: read

concurrency:
  group: full-flow-${{ inputs.pdk }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ihp130:
    if: inputs.pdk == 'IHP130'
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: IHP130
      profile: configs/ci/ihp130.mk
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ fromJSON(format('{0}', inputs.timeout_minutes)) }}
      behavioral_only: false
      tiny_p7_iverilog: include
      change_mode: full
      retention_days: 90
      artifact_suffix: -full-flow

  gf180:
    if: inputs.pdk == 'GF180'
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: GF180
      profile: configs/ci/gf180.mk
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ fromJSON(format('{0}', inputs.timeout_minutes)) }}
      behavioral_only: false
      tiny_p7_iverilog: include
      change_mode: full
      retention_days: 90
      artifact_suffix: -full-flow

  ics55:
    if: inputs.pdk == 'ICS55'
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: ICS55
      profile: configs/ci/ics55.mk
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ fromJSON(format('{0}', inputs.timeout_minutes)) }}
      behavioral_only: false
      tiny_p7_iverilog: include
      change_mode: full
      retention_days: 90
      artifact_suffix: -full-flow

  sky130:
    if: inputs.pdk == 'SKY130'
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: SKY130
      profile: configs/ci/sky130.mk
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ fromJSON(format('{0}', inputs.timeout_minutes)) }}
      behavioral_only: false
      tiny_p7_iverilog: include
      change_mode: full
      retention_days: 90
      artifact_suffix: -full-flow
