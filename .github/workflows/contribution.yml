name: contribution

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contribution-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate contribution metadata
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python3 scripts/check_contribution.py pr
          --root .
          --base-ref "${BASE_REF}"
          --head-ref "${HEAD_REF}"
          --title "${PR_TITLE}"
          --base "origin/${BASE_REF}"
          --head HEAD
          --output build/contribution/pr.json
          --step-summary "${GITHUB_STEP_SUMMARY}"

      - name: Validate ownership records
        run: >-
          python3 scripts/check_contribution.py ownership
          --root .
          --output build/contribution/ownership.json
          --step-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload contribution reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: contribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/contribution/*.json
          if-no-files-found: error
          retention-days: 30
