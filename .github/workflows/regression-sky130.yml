name: regression-sky130

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-sky130-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-open-source-flows:
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: SKY130
      profile: configs/ci/hazard3-rv32im-sky130.mk
      retention_days: 30
