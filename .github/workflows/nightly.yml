name: nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  ihp130-open-source-flows:
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: IHP130
      profile: configs/ci/ihp130.mk
      retention_days: 90
      timeout_minutes: 360
  extended-open-source-flows:
    uses: ./.github/workflows/_regression.yml
    with:
      suite: nightly-extra
      pdk: IHP130
      profile: configs/ci/ihp130.mk
      retention_days: 90
      timeout_minutes: 180

  tiny-p7-iverilog-ihp130:
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: IHP130
      profile: configs/ci/ihp130-tiny.mk
      retention_days: 90
      timeout_minutes: 360
      tiny_p7_iverilog: only
      tiny_p7_iverilog_timeout_seconds: 19800
      artifact_suffix: -tiny-p7-iverilog-ihp130

  tiny-p7-iverilog-ics55:
    uses: ./.github/workflows/_regression.yml
    with:
      suite: pr
      pdk: ICS55
      profile: configs/ci/ics55-tiny.mk
      retention_days: 90
      timeout_minutes: 480
      tiny_p7_iverilog: only
      tiny_p7_iverilog_timeout_seconds: 19800
      artifact_suffix: -tiny-p7-iverilog-ics55
