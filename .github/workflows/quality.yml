name: quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/ci.txt') }}

      - name: Install pinned quality tools
        run: python3 -m pip install --requirement requirements/ci.txt

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-14

      - name: Set up locked RTL formatter
        uses: ./.github/actions/locked-tools
        with:
          tools: verible

      - name: Validate dependency lock
        run: python3 scripts/dependency_lock.py --lock config/dependencies.lock.json

      - name: Set up locked RTL dependencies
        run: |
          python3 setup.py
          python3 rtl/managed/clusterip/setup.py

      - name: Validate SoC integration topology
        run: make check-soc-topology check-user-extensions check-clock-reset-domains

      - name: Lint Python
        run: ruff check .

      - name: Check source formatting
        run: make format-check

      - name: Check all self-owned RTL style rules
        run: make rtl-style-check-all

      - name: Check RTL readiness records
        run: make rtl-readiness-check-all

      - name: Check embedded C safety policy
        run: make sw-policy-check

      - name: Run embedded C host tests
        run: make sw-host-test

      - name: Test scripts
        run: python3 -m pytest -q

      - name: Lint YAML
        run: yamllint .github .yamllint.yml

      - name: Install pinned actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions
        run: actionlint

      - name: Validate regression definitions
        run: |
          python3 scripts/regress.py --root . --suite pr --pdk IHP130 --dry-run
          python3 scripts/regress.py --root . --suite pr --pdk GF180 --dry-run
          python3 scripts/regress.py --root . --suite pr --pdk ICS55 --dry-run
          python3 scripts/regress.py --root . --suite pr --pdk SKY130 --dry-run
          python3 scripts/regress.py --root . --suite nightly --pdk IHP130 --dry-run
          python3 scripts/regress.py --root . --suite smoke --pdk IHP130 --dry-run
