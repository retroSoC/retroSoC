name: quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/_change-impact.yml

  fast:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/build.txt', 'requirements/ci.txt') }}

      - name: Install pinned quality tools
        run: >-
          python3 -m pip install
          --requirement requirements/build.txt
          --requirement requirements/ci.txt

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-14

      - name: Set up locked RTL formatter
        uses: ./.github/actions/locked-tools
        with:
          tools: verible

      - name: Install pinned actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Validate dependency lock
        run: python3 scripts/dependency_lock.py --lock dependencies/dependencies.lock.json

      - name: Run fast quality checks
        run: make check-fast

      - name: Record agent context
        run: python3 scripts/agent_control.py context --root . --output build/engineering/agent-context.json

      - name: Upload fast reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/engineering/*.json
            build/**/meta/documentation-check.json
            build/**/meta/skill-eval-static.json
          if-no-files-found: warn
          retention-days: 14

  fixtures:
    needs: impact
    if: needs.impact.outputs.quality_fixtures == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/build.txt', 'requirements/ci.txt') }}

      - name: Restore locked source dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            physical/pdk/IHP-Open-PDK
            physical/pdk/icsprout55-pdk
            .cache/retrosoc/sources/ics55_ecos_pll
            .cache/retrosoc/sources/openc906
            rtl/managed/third_party
            .cache/retrosoc/pdk
            .cache/retrosoc/stamps
          key: quality-sources-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Restore locked toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .cache/retrosoc/downloads
            .cache/retrosoc/toolchains
          key: tools-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Restore accelerator reference cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .cache/retrosoc/sources/apu-libflac
            .cache/retrosoc/sources/apu-flac-corpus
            .cache/retrosoc/sources/apu-mlperf-tiny
            .cache/retrosoc/sources/apu-kws-mfcc
            .cache/retrosoc/sources/apu-tensorflow
            .cache/retrosoc/sources/apu-gemmlowp
            .cache/retrosoc/sources/npu-vww-corpus
            .cache/retrosoc/downloads/npu
          key: accelerator-reference-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Install pinned quality tools
        run: >-
          python3 -m pip install
          --requirement requirements/build.txt
          --requirement requirements/ci.txt

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-14

      - name: Set up locked RTL formatter
        uses: ./.github/actions/locked-tools
        with:
          tools: verible

      - name: Set up locked RTL dependencies
        run: |
          python3 setup.py
          python3 scripts/setup_openc906.py
          python3 rtl/managed/clusterip/setup.py
          python3 rtl/ip/setup.py

      - name: Prepare historical publication dependencies
        run: python3 tests/publication_history.py prepare

      - name: Set up locked IHP130 PDK
        run: make CONFIG=configs/ci/ihp130.mk setup-pdk

      - name: Set up locked Tiny ICS55 PDK and PLL
        run: make CONFIG=configs/ci/ics55-tiny.mk SOC=TINY PDK=ICS55 setup-pdk

      - name: Validate SoC integration topology
        run: make check-soc-topology check-user-extensions check-clock-reset-domains

      - name: Set up locked test tools
        uses: ./.github/actions/locked-tools
        with:
          tools: verilator sv2v iverilog yosys riscv_gnu

      - name: Set up locked accelerator references
        run: make setup-apu-reference setup-apu-kws-reference setup-npu-reference

      - name: Test scripts and RTL fixtures
        run: |
          mkdir -p build/pytest
          python3 -m pytest -q \
            --junitxml=build/pytest/junit.xml \
            --durations=25 --durations-min=0.1

      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pytest/junit.xml
            build/**/meta/*.json
            build/**/*.log
          if-no-files-found: warn
          retention-days: 30

  quality-gate:
    needs: [impact, fast, fixtures]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Aggregate quality verdict
        run: |
          args=(gate
            --job impact=${{ needs.impact.result }}
            --job fast=${{ needs.fast.result }}
            --job fixtures=${{ needs.fixtures.result }}
            --label quality
            --output build/ci-summary/quality.json
            --step-summary "${GITHUB_STEP_SUMMARY}")
          if [[ "${{ needs.impact.outputs.quality_fixtures }}" == "false" ]]; then
            args+=(--allow-skip fixtures)
          fi
          python3 scripts/ci_summary.py "${args[@]}"

      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-summary/quality.json
          if-no-files-found: error
          retention-days: 30
