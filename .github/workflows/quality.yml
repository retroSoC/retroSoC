name: quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Restore pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/ci.txt') }}

      - name: Install pinned quality tools
        run: python3 -m pip install --requirement requirements/ci.txt

      - name: Validate dependency lock
        run: python3 scripts/dependency_lock.py --lock config/dependencies.lock.json

      - name: Lint Python
        run: ruff check .

      - name: Test scripts
        run: python3 -m pytest -q

      - name: Lint YAML
        run: yamllint .github .yamllint.yml

      - name: Install pinned actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions
        run: actionlint

      - name: Validate regression definitions
        run: |
          python3 scripts/regress.py --root . --suite pr --dry-run
          python3 scripts/regress.py --root . --suite nightly --dry-run
