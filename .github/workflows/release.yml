name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore locked source dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            app/coremark/coremark-main
            app/fatfs/ff16
            physical/pdk/IHP-Open-PDK
            rtl/managed/clusterip/archinfo
            rtl/managed/clusterip/common
            rtl/managed/clusterip/crc
            rtl/managed/clusterip/ps2
            rtl/managed/clusterip/pwm
            rtl/managed/clusterip/rng
            rtl/managed/clusterip/rtc
            rtl/managed/clusterip/wdg
            rtl/managed/third_party
            rtl/managed/mpw
            .cache/retrosoc/stamps
          key: sources-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Install build Python dependency
        run: python3 -m pip install --requirement requirements/build.txt

      - name: Set up locked source dependencies
        run: make CONFIG=configs/ci/ihp130.mk setup

      - name: Build checksummed source package and SBOM
        run: make CONFIG=configs/ci/ihp130.mk package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: retrosoc-${{ github.ref_name }}
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
          mapfile -d '' files < <(find dist -type f -print0)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
