name: reusable regression

on:
  workflow_call:
    inputs:
      suite:
        description: Regression suite from scripts/regress.py
        required: true
        type: string
      pdk:
        description: PDK matrix selected by scripts/regress.py
        required: true
        type: string
      products:
        description: JSON product list; ALL preserves the suite's original command selection
        required: false
        default: '["ALL"]'
        type: string
      profile:
        description: Primary profile used for setup and environment checks
        required: true
        type: string
      retention_days:
        description: Report artifact retention
        required: false
        default: 30
        type: number
      timeout_minutes:
        description: Maximum job duration
        required: false
        default: 360
        type: number
      toolset:
        description: Space-separated locked tools required by this suite
        required: false
        default: verilator sv2v iverilog yosys opensta openocd sbt riscv_gnu
        type: string
      full_flow_checks:
        description: Check Yosys and OpenSTA environments before running the suite
        required: false
        default: true
        type: boolean
      formal_checks:
        description: Check the SBY, Yosys, sv2v, and Bitwuzla formal environment before the suite
        required: false
        default: false
        type: boolean
      behavioral_only:
        description: Skip synthesis, netlist simulation, OpenSTA, and synthesis-recipe metrics
        required: false
        default: true
        type: boolean
      parallel_iverilog:
        description: Overlap the isolated MINI PR Icarus assembly self-test without dropping commands
        required: false
        default: false
        type: boolean
      change_mode:
        description: Path-based auto selection or an unconditional full matrix
        required: false
        default: auto
        type: string
      runner:
        description: GitHub-hosted label or an explicitly provisioned high-memory runner
        required: false
        default: ubuntu-22.04
        type: string
      tiny_p7_iverilog:
        description: Include, exclude, or isolate the Tiny P7 Icarus acceptance command; excluded by default from PR jobs
        required: false
        default: exclude
        type: string
      tiny_p7_iverilog_timeout_seconds:
        description: Wall timeout for the Tiny P7 Icarus acceptance command
        required: false
        default: 14400
        type: number
      artifact_suffix:
        description: Optional suffix for the uploaded report artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  impact:
    uses: ./.github/workflows/_change-impact.yml
    with:
      mode: ${{ inputs.change_mode }}

  regression:
    needs: impact
    if: >-
      ${{
        (inputs.suite == 'smoke' && needs.impact.outputs.regression_smoke == 'true') ||
        (inputs.suite != 'smoke' && inputs.pdk == 'IHP130' && needs.impact.outputs.regression_ihp130 == 'true') ||
        (inputs.suite != 'smoke' && inputs.pdk == 'GF180' && needs.impact.outputs.regression_gf180 == 'true') ||
        (inputs.suite != 'smoke' && inputs.pdk == 'ICS55' && needs.impact.outputs.regression_ics55 == 'true') ||
        (inputs.suite != 'smoke' && inputs.pdk == 'SKY130' && needs.impact.outputs.regression_sky130 == 'true')
      }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.products) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PRODUCT_SUFFIX: ${{ matrix.product != 'ALL' && format('-{0}', matrix.product) || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Record run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Restore locked source dependencies
        id: sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            app/coremark/coremark-main
            app/fatfs/ff16
            physical/pdk/IHP-Open-PDK
            physical/pdk/gf180mcu-pdk
            physical/pdk/icsprout55-pdk
            physical/pdk/skywater-pdk
            rtl/managed/clusterip/archinfo
            rtl/managed/clusterip/common
            rtl/managed/clusterip/crc
            rtl/managed/clusterip/ps2
            rtl/managed/clusterip/pwm
            rtl/managed/clusterip/rng
            rtl/managed/clusterip/rtc
            rtl/managed/clusterip/wdg
            rtl/managed/third_party
            rtl/managed/mpw
            .cache/retrosoc/pdk
            .cache/retrosoc/stamps
          key: sources-${{ inputs.pdk }}-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Restore locked toolchains
        id: toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .cache/retrosoc/downloads
            .cache/retrosoc/toolchains
          key: tools-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Restore Verilator compiler cache
        id: ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache/retrosoc/ccache
          key: >-
            ${{ format('ccache-{0}-{1}-{2}-{3}-{4}-{5}',
            matrix.product, runner.os, hashFiles('dependencies/dependencies.lock.json'),
            github.sha, github.run_id, github.run_attempt) }}
          restore-keys: |
            ccache-${{ matrix.product }}-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}-${{ github.sha }}-
            ccache-${{ matrix.product }}-${{ runner.os }}-${{ hashFiles('dependencies/dependencies.lock.json') }}-

      - name: Install build Python dependency
        run: python3 -m pip install --requirement requirements/build.txt

      - name: Set up locked EDA and compiler tools
        uses: ./.github/actions/locked-tools
        with:
          tools: ${{ inputs.toolset }}

      - name: Set up locked source dependencies
        run: make CONFIG=${{ inputs.profile }} setup

      - name: Check behavioral environments
        run: |
          make CONFIG=${{ inputs.profile }} \
            SIMU=IVERILOG SYNTH=NONE STA=NONE doctor
          make CONFIG=${{ inputs.profile }} \
            SIMU=VERILATOR SYNTH=NONE STA=NONE doctor

      - name: Check synthesis and timing environments
        if: inputs.full_flow_checks
        run: |
          make CONFIG=${{ inputs.profile }} \
            SIMU=IVERILOG SYNTH=YOSYS STA=NONE doctor
          make CONFIG=${{ inputs.profile }} \
            SIMU=IVERILOG SYNTH=NONE STA=OPENSTA doctor

      - name: Check formal environment
        if: inputs.formal_checks
        run: make CONFIG=${{ inputs.profile }} formal-doctor

      - name: Record runner resources
        run: |
          nproc
          free -h
          df -h .

      - name: Run ${{ inputs.suite }} regression
        id: regression
        env:
          BEHAVIORAL_ONLY: ${{ inputs.behavioral_only }}
          SUITE: ${{ inputs.suite }}
          PDK: ${{ inputs.pdk }}
          PRODUCT: ${{ matrix.product }}
          TINY_P7_IVERILOG: ${{ inputs.tiny_p7_iverilog }}
          TINY_P7_TIMEOUT: ${{ inputs.tiny_p7_iverilog_timeout_seconds }}
          PARALLEL_IVERILOG: ${{ inputs.parallel_iverilog }}
        run: |
          set -euo pipefail
          args=(--root . --suite "${SUITE}" --pdk "${PDK}"
                --tiny-p7-iverilog "${TINY_P7_IVERILOG}"
                --tiny-p7-iverilog-timeout-seconds "${TINY_P7_TIMEOUT}")
          if [[ "${PRODUCT}" != "ALL" ]]; then
            args+=(--soc "${PRODUCT}")
          fi
          if [[ "${BEHAVIORAL_ONLY}" == "true" ]]; then
            args+=(--behavioral-only)
          fi
          if [[ "${PARALLEL_IVERILOG}" == "true" && "${PRODUCT}" == "MINI" ]]; then
            args+=(--parallel-iverilog)
          fi
          /usr/bin/time -v python3 scripts/regress.py "${args[@]}"

      - name: Summarize CI evidence
        if: always()
        env:
          BEHAVIORAL_ONLY: ${{ inputs.behavioral_only }}
          SUITE: ${{ inputs.suite }}
          PDK: ${{ inputs.pdk }}
          PRODUCT: ${{ matrix.product }}
          RUN_STATUS: ${{ steps.regression.outcome }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}${{ env.PRODUCT_SUFFIX }}
        run: |
          set -euo pipefail
          args=(--root . --build-root build --since "${RUN_STARTED}"
                --label "${SUITE}-${PDK}-${PRODUCT}" --profile "${{ inputs.profile }}"
                --pdk "${PDK}" --suite "${SUITE}" --run-status "${RUN_STATUS}"
                --output "build/ci-summary/${SUITE}-${PDK}${ARTIFACT_SUFFIX}.json"
                --step-summary "${GITHUB_STEP_SUMMARY}")
          if [[ "${BEHAVIORAL_ONLY}" == "true" ]]; then
            args+=(--behavioral-only)
          elif [[ "${SUITE}" != "smoke" ]]; then
            args+=(--require-full-flow)
          fi
          python3 scripts/ci_summary.py collect "${args[@]}"

      - name: Record cache observations
        if: always()
        run: >-
          python3 scripts/ci_recovery.py cache-report
          --output build/ci-summary/cache.json
          --cache "sources=${{ steps.sources.outputs.cache-hit }}"
          --cache "toolchains=${{ steps.toolchains.outputs.cache-hit }}"
          --cache "ccache=${{ steps.ccache.outputs.cache-hit }}"

      - name: Upload reports and structured results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.suite }}-regression-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.artifact_suffix }}${{ env.PRODUCT_SUFFIX }}
          path: |
            build/ci-summary/*.json
            build/**/meta/*.json
            build/**/result*.json
            build/**/formal/**/*.sby
            build/**/formal/**/*.smt2
            build/**/formal/**/*.vcd
            build/**/formal/**/*.yw
            build/**/formal/**/status
            build/**/*.log
            build/**/*.rpt
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  regression-gate:
    needs: [impact, regression]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Aggregate regression verdict
        env:
          EXPECTED: >-
            ${{
              (inputs.suite == 'smoke' && needs.impact.outputs.regression_smoke == 'true') ||
              (inputs.suite != 'smoke' && inputs.pdk == 'IHP130' && needs.impact.outputs.regression_ihp130 == 'true') ||
              (inputs.suite != 'smoke' && inputs.pdk == 'GF180' && needs.impact.outputs.regression_gf180 == 'true') ||
              (inputs.suite != 'smoke' && inputs.pdk == 'ICS55' && needs.impact.outputs.regression_ics55 == 'true') ||
              (inputs.suite != 'smoke' && inputs.pdk == 'SKY130' && needs.impact.outputs.regression_sky130 == 'true')
            }}
        run: |
          args=(gate
            --job impact=${{ needs.impact.result }}
            --job regression=${{ needs.regression.result }}
            --label "${{ inputs.suite }}-${{ inputs.pdk }}"
            --output "build/ci-summary/regression-gate-${{ inputs.suite }}-${{ inputs.pdk }}${{ inputs.artifact_suffix }}.json"
            --step-summary "${GITHUB_STEP_SUMMARY}")
          if [[ "${EXPECTED}" == "false" ]]; then
            args+=(--allow-skip regression)
          fi
          python3 scripts/ci_summary.py "${args[@]}"

      - name: Upload regression gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: regression-gate-${{ inputs.suite }}-${{ inputs.pdk }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.artifact_suffix }}
          path: build/ci-summary/regression-gate-*.json
          if-no-files-found: error
          retention-days: 30
