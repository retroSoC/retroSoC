name: skill-evals

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      runner:
        description: Override the runner with a configured Codex CLI and approved model access
        required: false
        type: string
      scope:
        description: One smoke case per Skill, or every live case
        required: true
        default: smoke
        type: choice
        options: [smoke, all]
      skill:
        description: A registered Skill name, or all Skills
        required: true
        default: all
        type: string
      agent:
        description: Agent CLI used for isolated read-only evaluations
        required: true
        default: codex
        type: choice
        options: [codex, kimi]
      model:
        description: Optional explicit model name recorded in the evidence
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.ref }}-${{ inputs.scope || 'smoke' }}-${{ inputs.skill || 'all' }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'schedule' || vars.RETROSOC_SKILL_EVALS_ENABLED == 'true'
    runs-on: ${{ inputs.runner || vars.RETROSOC_EVAL_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: ${{ inputs.scope == 'all' && inputs.skill == 'all' && 480 || 90 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check evaluation runner
        env:
          EVAL_AGENT: ${{ inputs.agent || vars.RETROSOC_EVAL_AGENT || 'codex' }}
        run: |
          if ! command -v "${EVAL_AGENT}" >/dev/null 2>&1; then
            echo "${EVAL_AGENT} CLI is required on the selected runner; no behavior result is claimed." >&2
            exit 2
          fi
          "${EVAL_AGENT}" --version

      - name: Run isolated read-only Skill evaluations
        env:
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_AGENT: ${{ inputs.agent || vars.RETROSOC_EVAL_AGENT || 'codex' }}
          EVAL_SCOPE: ${{ inputs.scope || 'smoke' }}
          EVAL_SKILL: ${{ inputs.skill || 'all' }}
        run: |
          args=(--root . --runner "${EVAL_AGENT}" --timeout 600 --output "build/agent-evals/${EVAL_SCOPE}")
          if [[ "${EVAL_SCOPE}" == "smoke" ]]; then
            args+=(--smoke)
          fi
          if [[ "${EVAL_SKILL}" != "all" ]]; then
            args+=(--skill "${EVAL_SKILL}")
          fi
          if [[ -n "${EVAL_MODEL}" ]]; then
            args+=(--model "${EVAL_MODEL}")
          fi
          python3 scripts/skill_eval.py run "${args[@]}"

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: skill-evals-${{ inputs.scope || 'smoke' }}-${{ inputs.skill || 'all' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/agent-evals/${{ inputs.scope || 'smoke' }}/*.json
            build/agent-evals/${{ inputs.scope || 'smoke' }}/*.jsonl
            build/agent-evals/${{ inputs.scope || 'smoke' }}/*.log
          if-no-files-found: error
          retention-days: 30
